name: Fab free asset DM

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fab-free-asset-dm
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Install Firefox
        if: github.event_name != 'push'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.5700.1 install --with-deps firefox
      - name: Check Fab and send DM
        if: github.event_name != 'push'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: go run ./cmd/action-notifier
      - name: Save notification state
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/seen-assets.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-assets.json
          git commit -m "chore: update notified Fab assets"
          git push
